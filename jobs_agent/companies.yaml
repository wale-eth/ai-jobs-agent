# The company registry. Every slug verified live against its ATS API.
# Weighted toward UK-relevant employers with data/ML hiring and sponsorship
# track records. Failing boards are skipped and reported per sweep, so pruning
# stays data-driven. To grow coverage, add entries here.
#
# 2026-08-12: +69 employers (101 -> 170). Two sources, both verified live and
# confirmed to belong to the named company before being added:
#   * direct ATS discovery across Greenhouse/Lever/Ashby
#   * companies found on Welcome to the Jungle, then resolved to their OWN ATS
#     so the roles arrive first-hand rather than via an aggregator
# A 200 from an ATS is NOT proof of ownership: the guess "london" for London
# Stock Exchange returned a live board belonging to Aime Leon Dore, and "blue"
# for Blue Light Card an unrelated one. Both were rejected. Verify the board's
# declared company name before adding a slug.

